<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Advanced Attendance System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        select, button, input { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; }
        .btn-action { background: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="setup-screen">
    <h3>অরুণদীপ্ত Attendance</h3>
    <select id="subject-select">
        <option value="Anatomy">Anatomy</option>
        <option value="Physiology">Physiology</option>
        <option value="Biochemistry">Biochemistry</option>
    </select>
    <input type="date" id="date-select">
    <button class="btn-action" onclick="startAttendance()">Start Attendance</button>
    <button style="background: #2c3e50; color:white;" onclick="viewHistory()">View History</button>
</div>

<div class="container" id="attendance-screen" style="display:none;">
    <h3 id="display-subj">...</h3>
    <div id="name-display" style="font-size: 24px; font-weight: bold; margin: 20px 0;">...</div>
    <div style="display:flex; gap:10px;">
        <button class="btn-action" style="background:#e74c3c" onclick="saveAttendance('Absent')">Absent</button>
        <button class="btn-action" style="background:#27ae60" onclick="saveAttendance('Present')">Present</button>
    </div>
</div>

<div class="container" id="report-screen" style="display:none;">
    <h3>Report</h3>
    <div id="report-table"></div>
    <button class="btn-action" onclick="location.reload()">Back</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyATiLTxkOozG5PsSWjJLMufBFatkyhLw1M",
        authDomain: "attendance-a8670.firebaseapp.com",
        projectId: "attendance-a8670",
        storageBucket: "attendance-a8670.firebasestorage.app",
        messagingSenderId: "663617690927",
        appId: "1:663617690927:web:d1cb6bcad6a6a387a0d5da",
        measurementId: "G-HTXZ99WB7W"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);

    // স্টুডেন্ট লিস্ট (তোমার আগের লিস্ট)
    const students = [
        { "roll": "1", "name": "MD. KAWSER AZAM" },
        { "roll": "2", "name": "S. B. ANURADHA" }
        // এখানে বাকি সব স্টুডেন্ট বসিয়ে দিও
    ];

    let currentIdx = 0;
    let selectedSubject = "";
    let selectedDate = "";

    window.startAttendance = function() {
        selectedSubject = document.getElementById('subject-select').value;
        selectedDate = document.getElementById('date-select').value || new Date().toISOString().split('T')[0];
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('attendance-screen').style.display = 'block';
        updateName();
    }

    function updateName() {
        if(currentIdx < students.length) {
            document.getElementById('display-subj').innerText = `${selectedSubject} - Roll ${students[currentIdx].roll}`;
            document.getElementById('name-display').innerText = students[currentIdx].name;
        } else {
            alert("Attendance Done!");
            location.reload();
        }
    }

    window.saveAttendance = async function(status) {
        const student = students[currentIdx];
        // Firebase Modular syntax ব্যবহার করা হয়েছে
        try {
            await set(ref(db, 'attendance/' + selectedDate + '/' + selectedSubject + '/' + student.roll), {
                name: student.name,
                status: status
            });
            currentIdx++;
            updateName();
        } catch (e) {
            alert("Error: " + e.message);
        }
    }

    window.viewHistory = async function() {
        const date = prompt("Enter Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
        const subj = prompt("Enter Subject (Anatomy/Physiology/Biochemistry):", "Anatomy");
        
        const dbRef = ref(db);
        try {
            const snapshot = await get(child(dbRef, 'attendance/' + date + '/' + subj));
            if (snapshot.exists()) {
                const data = snapshot.val();
                let html = `<table><tr><th>Roll</th><th>Name</th><th>Status</th></tr>`;
                for (let roll in data) {
                    html += `<tr><td>${roll}</td><td>${data[roll].name}</td><td>${data[roll].status}</td></tr>`;
                }
                html += `</table>`;
                document.getElementById('report-table').innerHTML = html;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('report-screen').style.display = 'block';
            } else {
                alert("No data found for this date/subject.");
            }
        } catch (e) {
            alert("Error fetching data");
        }
    }
</script>
</body>
</html>
