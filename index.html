<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arundeepto</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #2980b9; --bg: #f4f7f6; --white: #ffffff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); padding: 15px; margin: 0; color: #333; }
        .container { max-width: 500px; margin: 20px auto; background: var(--white); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; font-weight: 700; }
        
        .toggle-group { display: flex; gap: 10px; margin-bottom: 15px; padding: 10px; background: #f0f4f8; border-radius: 8px; }
        
        .input-group { margin-bottom: 15px; }
        .row-label { font-weight: 600; color: var(--accent); display: block; margin-bottom: 5px; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 10px; transition: 0.3s; }
        .btn-view { background: var(--primary); color: white; }
        .btn-dl { background: #27ae60; color: white; }
        .btn-back { background: #95a5a6; color: white; }

        /* Preview Styling */
        #preview-section { display: none; }
        #capture-area { background: white; padding: 30px; width: 450px; margin: auto; border: 1px solid #ddd; border-radius: 8px; }
        .header-box { text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; margin-bottom: 15px; }
        .college-name { font-size: 22px; font-weight: bold; color: #2c3e50; }
        .batch-name { font-size: 14px; color: #7f8c8d; margin-top: 5px; }
        
        .section-title { font-weight: bold; margin: 15px 0 5px 0; border-left: 4px solid #2980b9; padding-left: 8px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; border: 1px solid #dee2e6; padding: 8px; font-size: 12px; }
        td { border: 1px solid #dee2e6; padding: 8px; text-align: center; font-size: 12px; }
        
        .notice-box-preview { margin-top: 20px; padding: 15px; background: #fffdf0; border-left: 5px solid #f1c40f; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .notice-header { color: #d35400; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        
        /* এখানে বোল্ড করা হয়েছে */
        .notice-content-preview { font-size: 13px; color: #000; line-height: 1.5; white-space: pre-wrap; font-weight: bold; }
        
        .footer-credit { text-align: center; margin-top: 30px; font-size: 10px; color: #999; }
    </style>
</head>
<body>

<div class="container" id="input-section">
    <h2>Arundeepto</h2>
    
    <div class="toggle-group">
        <label><input type="checkbox" id="inc-schedule" checked> সিডিউল</label>
        <label><input type="checkbox" id="inc-notice" checked> নোটিশ</label>
    </div>

    <div class="input-group">
        <span class="row-label">সিডিউলের তারিখ</span>
        <input type="date" id="date-schedule">
    </div>

    <div id="fields"></div>

    <div class="input-group">
        <span class="row-label">নোটিশের তারিখ</span>
        <input type="date" id="date-notice">
    </div>
    <div class="input-group">
        <span class="row-label">নোটিশের বিবরণ</span>
        <textarea id="notice" placeholder="নোটিশ এখানে লিখুন..."></textarea>
    </div>

    <button class="btn-view" onclick="showPreview()">প্রিভিউ দেখুন</button>
</div>

<div id="preview-section">
    <div class="container">
        <div id="capture-area">
            <div class="header-box">
                <div class="college-name">Nilphamari Medical College</div>
                <div class="batch-name">Arundeepto</div>
            </div>
            
            <div id="prev-schedule">
                <div class="section-title">Class Schedule | <span id="res-date-schedule"></span></div>
                <table>
                    <thead><tr><th>Time</th><th>Subject</th><th>Topic</th><th>Teacher</th></tr></thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>

            <div id="prev-notice" class="notice-box-preview">
                <div class="notice-header">📢 Notice (Date: <span id="res-date-notice"></span>)</div>
                <div id="res-notice" class="notice-content-preview"></div>
            </div>

            <div class="footer-credit">Powered By: IT Committee</div>
        </div>
        <button class="btn-dl" onclick="downloadImage()">Download HD Image</button>
        <button class="btn-back" onclick="hidePreview()">Back</button>
    </div>
</div>

<script>
    const teacherData = {
        "Anatomy": ["Dr. Shamima Maam", "Dr. Farzana Maam", "Dr. Noman Sir", "Dr. Anup Sir", "Dr. Millat Sir"],
        "Biochemistry": ["Dr. Mazed Sir", "Dr. Ayesha Maam", "Dr. Hadiuzzaman Sir", "Dr. Hasinur Sir", "Dr. Naima Maam"],
        "Physiology": ["Dr. Shila Maam", "Dr. Liza Maam", "Dr. Sara Maam", "Dr. Bipasha Maam"]
    };

    const scheduleTimes = ["08:00 - 10:00", "10:30 - 12:30", "12:30 - 14:30"];
    const container = document.getElementById('fields');

    scheduleTimes.forEach((time, index) => {
        container.innerHTML += `
            <div class="input-group" style="background:#f9f9f9; padding:10px; border-radius:8px;">
                <span class="row-label">${time}</span>
                <select id="sub${index}" onchange="updateTeachers(${index})"><option value="">Subject</option>${Object.keys(teacherData).map(s => `<option value="${s}">${s}</option>`).join('')}</select>
                <input type="text" placeholder="Topic" id="top${index}" style="margin-top:5px;">
                <select id="teach${index}" style="margin-top:5px;"><option value="">Teacher</option></select>
            </div>
        `;
    });

    function updateTeachers(index) {
        const sub = document.getElementById(`sub${index}`).value;
        const teachSelect = document.getElementById(`teach${index}`);
        teachSelect.innerHTML = '<option value="">Teacher</option>';
        if (sub && teacherData[sub]) {
            teacherData[sub].forEach(t => teachSelect.innerHTML += `<option value="${t}">${t}</option>`);
        }
    }

    function showPreview() {
        document.getElementById('prev-schedule').style.display = document.getElementById('inc-schedule').checked ? 'block' : 'none';
        document.getElementById('prev-notice').style.display = document.getElementById('inc-notice').checked ? 'block' : 'none';
        
        document.getElementById('res-date-schedule').innerText = document.getElementById('date-schedule').value;
        document.getElementById('res-date-notice').innerText = document.getElementById('date-notice').value;
        document.getElementById('res-notice').innerText = document.getElementById('notice').value;
        
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';
        scheduleTimes.forEach((time, index) => {
            const sub = document.getElementById(`sub${index}`).value;
            const top = document.getElementById(`top${index}`).value;
            const teach = document.getElementById(`teach${index}`).value;
            if(sub || top || teach) tbody.innerHTML += `<tr><td>${time}</td><td>${sub}</td><td>${top}</td><td>${teach}</td></tr>`;
        });

        document.getElementById('input-section').style.display = 'none';
        document.getElementById('preview-section').style.display = 'block';
    }

    function hidePreview() {
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('preview-section').style.display = 'none';
    }

    function downloadImage() {
        html2canvas(document.querySelector("#capture-area"), {scale: 3}).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Schedule_Notice.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>
</body>
</html>
