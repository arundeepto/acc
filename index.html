        <option value="Physiology">Physiology</option>

    <button class="btn-action" onclick="startAttendance()">Start Attendance</button>
    <hr>
    <button style="background: #2c3e50; color:white;" onclick="viewHistory()">View History</button>
</div>

    <h3 id="display-subj">...</h3>
    <div id="name-display" style="font-size: 24px; font-weight: bold; margin: 20px 0;">...</div>
    <div style="display:flex; gap:10px;">

        <button class="btn-action" style="background:var(--success)" onclick="saveAttendance('Present')">Present</button>
    </div>
</div>

    let currentIdx = 0;
    let selectedSubject = "";
    let selectedDate = "";

    function startAttendance() {
        selectedSubject = document.getElementById('subject-select').value;
        selectedDate = document.getElementById('date-select').value || new Date().toISOString().split('T')[0];
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('attendance-screen').style.display = 'block';
        updateName();
    }

    function updateName() {
        if(currentIdx < students.length) {
            document.getElementById('display-subj').innerText = `${selectedSubject} - Roll ${students[currentIdx].roll}`;
            document.getElementById('name-display').innerText = students[currentIdx].name;
        } else {
            alert("Attendance Done!");
            location.reload();
        }
    }

    function saveAttendance(status) {
        const student = students[currentIdx];
        // Firebase এ ডেটা সেভ করা
        db.ref('attendance/' + selectedDate + '/' + selectedSubject + '/' + student.roll).set({
            name: student.name,
            status: status
        });
        currentIdx++;
        updateName();
    }

    function viewHistory() {
        const date = prompt("Enter Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
        const subj = prompt("Enter Subject (Anatomy/Physiology/Biochemistry):", "Anatomy");
        
        db.ref('attendance/' + date + '/' + subj).once('value').then((snapshot) => {
            const data = snapshot.val();
            let html = `<table><tr><th>Roll</th><th>Name</th><th>Status</th></tr>`;
            for (let roll in data) {
                html += `<tr><td>${roll}</td><td>${data[roll].name}</td><td>${data[roll].status}</td></tr>`;
            }
            html += `</table>`;
            document.getElementById('report-table').innerHTML = html;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';
        });
